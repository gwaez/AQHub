<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AQAAR Command</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#07111c;--panel:#0c1826;--card:#0f2033;--line:rgba(125,211,252,.16);--text:#e8f3ff;--muted:#8aa4bc;--cyan:#22d3ee;--ok:#34d399;--warn:#fbbf24;--hot:#fb7185}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:radial-gradient(900px 500px at 100% 0%,rgba(34,211,238,.1),transparent 55%),var(--bg)}
.app{max-width:1480px;margin:0 auto;padding:12px;min-height:100%;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(12,24,38,.92)}
.brand{display:flex;gap:8px;align-items:center}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#60a5fa)}
.brand h1{margin:0;font-size:.95rem}.brand p{margin:0;color:var(--muted);font-size:.72rem}
.views,.filters{display:flex;gap:4px;flex-wrap:wrap;padding:3px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.chipbtn{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:9px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.chipbtn.on{background:rgba(34,211,238,.16);color:var(--cyan)}
.chipbtn b{font-family:"JetBrains Mono",monospace;margin-right:4px}
.actions,.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn,input,select,textarea{border:1px solid var(--line);background:rgba(15,32,51,.95);color:var(--text);border-radius:10px;padding:7px 10px;font:inherit;outline:none}
.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:.8rem}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#60a5fa);color:#04131a;border:0;font-weight:700}
.btn.ghost{color:var(--muted);background:transparent}.btn:disabled{opacity:.4;cursor:not-allowed}
.icon{position:relative;width:34px;height:34px;padding:0;display:grid;place-items:center}
.badge{position:absolute;top:-4px;left:-4px;min-width:15px;height:15px;border-radius:999px;background:var(--hot);color:#fff;font-size:.62rem;display:grid;place-items:center}
.toolbar input[type=search]{min-width:180px;flex:1}
.main{flex:1}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:8px;align-items:start}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.kanban{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:14px;background:rgba(12,24,38,.7);padding:6px;min-height:380px}
.col.over{outline:2px solid rgba(34,211,238,.45)}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;margin-bottom:4px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.75rem;font-weight:600}
.sw{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:5px;background:currentColor;box-shadow:0 0 7px currentColor}
.cards{display:flex;flex-direction:column;gap:5px;min-height:60px}
.card{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:rgba(15,32,51,.96);cursor:grab;transition:.12s}
.card:hover{border-color:rgba(34,211,238,.35)}
.card.dragging{opacity:.35}
.card .title{font-size:.8rem;font-weight:650;line-height:1.25;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-size:.62rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.src{color:#a5f3fc}.tag.bot{color:#fde68a;border-color:rgba(251,191,36,.35)}
.prio{display:inline-flex;gap:2px;align-items:center;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 6px;font-size:.62rem;color:var(--muted);background:transparent}
.prio .pip{width:5px;height:5px;border-radius:50%;background:#334155}
.prio[data-p=low] .pip:nth-child(1){background:var(--ok)}
.prio[data-p=medium] .pip:nth-child(-n+2){background:var(--warn)}
.prio[data-p=high] .pip:nth-child(-n+3){background:var(--hot)}
.prio[data-p=urgent] .pip{background:var(--hot);box-shadow:0 0 5px var(--hot)}
.row{display:flex;gap:4px;margin-top:4px}
.mini{flex:1;border:1px solid var(--line);background:rgba(34,211,238,.06);color:var(--cyan);border-radius:8px;padding:3px 6px;font:inherit;font-size:.65rem;cursor:pointer}
.mini.ghost{color:var(--muted);background:transparent}.mini:disabled{opacity:.3}
.list{display:flex;flex-direction:column;gap:4px}
.list-row{display:grid;grid-template-columns:1.5fr .6fr .6fr .6fr auto;gap:6px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(15,32,51,.95);cursor:pointer;font-size:.8rem}
.list-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-row .s{color:var(--muted);font-size:.72rem}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx{border:1px solid var(--line);border-radius:14px;min-height:180px;padding:8px;background:rgba(12,24,38,.7)}
.mx h3{margin:0 0 6px;font-size:.78rem;color:var(--muted)}.mx .cards{display:flex;flex-wrap:wrap;gap:5px}.mx .card{width:calc(50% - 3px);min-width:140px}
.focus{max-width:680px;margin:0 auto}.focus-hero{padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:rgba(34,211,238,.06)}
.focus-hero h2{margin:0 0 4px;font-size:.95rem}.focus-hero p{margin:0;color:var(--muted);font-size:.78rem}
.empty{color:var(--muted);text-align:center;padding:14px 6px;border:1px dashed var(--line);border-radius:10px;font-size:.75rem}
.backdrop{position:fixed;inset:0;background:rgba(2,8,16,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.15s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:14px;transform:translate(-50%,110%);width:min(500px,calc(100vw - 20px));max-height:min(78vh,620px);background:rgba(12,24,38,.98);border:1px solid rgba(34,211,238,.28);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:41;display:flex;flex-direction:column;transition:transform .18s}
.sheet.open{transform:translate(-50%,0)}
.sheet-h{padding:10px 12px 6px;display:flex;justify-content:space-between;gap:8px;align-items:start}
.sheet-h .eid{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--cyan)}
.sheet-h h2{margin:3px 0 0;font-size:.92rem;line-height:1.3}
.quick{display:flex;gap:4px;flex-wrap:wrap;padding:0 12px 8px}
.qchip{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);border-radius:999px;padding:4px 8px;font:inherit;font-size:.7rem;cursor:pointer}
.qchip.on{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.sheet-b{padding:0 12px 10px;overflow:auto;display:grid;gap:8px}
.field{display:grid;gap:4px}.field span{font-size:.7rem;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheet textarea{min-height:54px;resize:vertical}
.botbox{border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.06);border-radius:12px;padding:8px;display:grid;gap:6px}
.botbox .lab{font-size:.72rem;color:#fde68a;font-weight:600}
.checks{display:grid;gap:4px}
.check{display:flex;gap:6px;align-items:center;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.18)}
.check input[type=checkbox]{width:auto}.check input[type=text]{flex:1;border:0;background:transparent;padding:0}
.comments{display:grid;gap:4px;max-height:110px;overflow:auto}
.comment{padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.22);font-size:.72rem}
.comment .by{color:var(--cyan);font-size:.65rem}
.sheet-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.68rem;line-height:1.4}
.toast-wrap{position:fixed;top:12px;left:12px;z-index:60;display:grid;gap:6px;width:min(320px,calc(100vw - 24px))}
.toast{background:#102033;border:1px solid rgba(34,211,238,.3);border-radius:12px;padding:9px 11px}
.toast b{display:block;font-size:.82rem}.toast span{color:var(--muted);font-size:.72rem}
.toast .actions{margin-top:6px;display:flex;gap:4px}
.notes{position:fixed;top:58px;left:12px;width:min(320px,calc(100vw - 24px));max-height:45vh;overflow:auto;z-index:55;display:none;background:#102033;border:1px solid var(--line);border-radius:12px}
.notes.show{display:block}.notes-h{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.82rem}
.note{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04)}.note .t{font-size:.78rem;font-weight:600}.note .d{color:var(--muted);font-size:.7rem}

.modetog{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.modetog button{flex:1;border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font:inherit;font-size:.72rem;font-weight:600;cursor:pointer}
.modetog button.on{background:rgba(34,211,238,.18);color:var(--cyan)}
.btn.danger{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;border:0;font-weight:700}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1000;border:0;font-weight:700}
.btn.run{width:100%;justify-content:center;margin-top:2px}
.runov{position:fixed;inset:0;z-index:80;background:rgba(2,6,12,.92);display:none;flex-direction:column;padding:14px;font-family:"JetBrains Mono","IBM Plex Sans Arabic",monospace}
.runov.show{display:flex}
.runov-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid rgba(34,211,238,.25);border-radius:12px;background:rgba(8,18,28,.95)}
.runov-h .ttl{font-size:.85rem;font-weight:700;color:var(--cyan)}
.runov-h .meta{color:var(--muted);font-size:.72rem}
.stchip{padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:700;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.stchip.running{color:#fbbf24;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12);animation:pulse 1.2s ease infinite}
.stchip.done{color:#34d399;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.stchip.stopped{color:#94a3b8;border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.08)}
.stchip.error{color:#fb7185;border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.12)}
.stchip.queued{color:#67e8f9;border-color:rgba(103,232,249,.35)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.runlog{flex:1;margin-top:10px;overflow:auto;border:1px solid rgba(34,211,238,.2);border-radius:12px;background:#050b12;padding:10px 12px;font-size:.78rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.runlog .ln{color:#9fb6cb}.runlog .ln .tm{color:#475569;margin-left:8px}
.runov-f{display:flex;gap:8px;justify-content:flex-end;padding-top:10px;flex-wrap:wrap}
.bgchip{position:fixed;bottom:16px;left:16px;z-index:70;display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(15,32,51,.96);border:1px solid rgba(251,191,36,.4);box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;font-size:.75rem;font-weight:600;color:#fde68a}
.bgchip.show{display:inline-flex}
.bgchip .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 8px #fbbf24;animation:pulse 1.2s ease infinite}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo"></div><div><h1>AQAAR Command</h1><p>كروت خفيفة · أوامر بوت · إيميل مباشر</p></div></div>
    <div class="views" id="viewSwitch">
      <button class="chipbtn on" type="button" data-view="kanban">كانبان</button>
      <button class="chipbtn" type="button" data-view="list">قائمة</button>
      <button class="chipbtn" type="button" data-view="matrix">أولوية</button>
      <button class="chipbtn" type="button" data-view="focus">تركيز</button>
    </div>
    <div class="filters" id="statFilters">
      <button class="chipbtn on" type="button" data-filter="all">الكل <b id="statTotal">0</b></button>
      <button class="chipbtn" type="button" data-filter="doing">الجاري <b id="statDoing">0</b></button>
      <button class="chipbtn" type="button" data-filter="hot">الحرج <b id="statHot">0</b></button>
      <button class="chipbtn" type="button" data-filter="done">تم <b id="statDone">0</b></button>
      <button class="chipbtn" type="button" data-filter="bot">أوامر بوت <b id="statBot">0</b></button>
      <button class="chipbtn" type="button" data-filter="late">متأخر <b id="statLate">0</b></button>
      <button class="chipbtn" type="button" data-filter="rejected">مرفوض <b id="statRejected">0</b></button>
      <button class="chipbtn" type="button" data-filter="needs_reply">يحتاج رد <b id="statNeedsReply">0</b></button>
    </div>
    <div class="actions">
      <button class="btn icon" id="btnNotif" type="button">🔔<span class="badge" id="notifBadge" hidden>0</span></button>
      <button class="btn" id="btnSync" type="button">مزامنة إيميل</button>
      <a class="btn ghost" href="./index.html">Control</a>
      <button class="btn" id="btnReload" type="button">تحديث</button>
      <button class="btn primary" id="btnAdd" type="button">جديد</button>
      <button class="btn" id="btnSave" type="button" disabled>حفظ</button>
    </div>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="بحث..." />
    <select id="filterSource"><option value="">المصدر</option><option>email</option><option>teams</option><option>crm</option><option>whatsapp</option><option>manual</option><option>other</option></select>
    <select id="filterPriority"><option value="">الأهمية</option><option>urgent</option><option>high</option><option>medium</option><option>low</option></select>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-h"><div><div class="eid" id="sId">T-000</div><h2 id="sTitle">تاسك</h2></div><button class="btn ghost" type="button" id="btnClose">إغلاق</button></div>
  <div class="quick" id="quickStatus"></div>
  <div class="sheet-b">
    <label class="field"><span>العنوان</span><input id="fTitle" /></label>
    <div class="row2">
      <label class="field"><span>الأهمية</span><select id="fPriority"><option>low</option><option>medium</option><option>high</option><option>urgent</option></select></label>
      <label class="field"><span>الاستحقاق</span><input id="fDue" type="date" /></label>
    </div>
    <div class="botbox">
      <div class="lab">أمر تنفيذي للبوت</div>
      <label class="field"><span>نوع الأمر</span>
        <select id="fBotAction">
          <option value="none">بدون</option>
          <option value="draft_reply">جهّز رد</option>
          <option value="remind">فكّرني لاحقًا / نوت تذكير</option>
          <option value="follow_up">متابعة</option>
          <option value="research">ابحث / لخّص</option>
          <option value="move_trash">حط في تراش</option>
          <option value="custom">مخصص / أخرى</option>
        </select>
      </label>
      <label class="field"><span>تعليمات البوت</span><textarea id="fBotInstruction" placeholder="مثال: جهّز رد مهني وأنا أراجعه قبل الإرسال"></textarea></label>
      <div class="field"><span>وضع التشغيل</span>
        <div class="modetog" id="runModeToggle" role="group" aria-label="وضع التشغيل">
          <button type="button" data-mode="live" class="on" id="modeLive">على الشاشة</button>
          <button type="button" data-mode="background" id="modeBg">في الخلفية</button>
        </div>
      </div>
      <button class="btn primary run" type="button" id="btnRunBot">نفّذ الأمر الآن</button>
      <p class="hint" style="margin:0">الوضع الافتراضي: على الشاشة (تقدر توقف فورًا). جهّز الرد بس، ومش هيتبعت إيميل تلقائي.</p>
    </div>
    <label class="field"><span>نوت سريعة / تعليق</span>
      <div class="comments" id="commentsBox"></div>
      <div class="row" style="margin-top:4px">
        <input id="fComment" placeholder="اكتب نوت أو طلب..." style="flex:1" />
        <button class="btn" type="button" id="btnAddComment">إضافة</button>
      </div>
    </label>
    <div class="row2">
      <label class="field"><span>المصدر</span><select id="fSource"><option>manual</option><option>email</option><option>teams</option><option>crm</option><option>whatsapp</option><option>other</option></select></label>
      <label class="field"><span>المسؤول</span><input id="fAssignee" /></label>
    </div>
    <label class="field"><span>مرجع المصدر</span><input id="fSourceRef" /></label>
    <label class="field"><span>مسودة رد مقترحة</span><textarea id="fSuggested" placeholder="تظهر تلقائي من الإيميل الجديد..."></textarea></label>
    <input type="hidden" id="fStatus" /><input type="hidden" id="fEntryId" /><input type="hidden" id="fTags" /><input type="hidden" id="fProgress" value="0" /><input type="hidden" id="fNotes" />
    <p class="hint">الكروت متعمدة قصيرة. الأوامر هنا يتنفّذها البوت لما تطلب، مش تلقائيًا.</p>
  </div>
  <div class="sheet-f">
    <button class="btn" type="button" id="btnDelete">حذف</button>
    <button class="btn" type="button" id="btnOpenSrc">فتح المصدر</button>
    <button class="btn gold" type="button" id="btnOpenRoom">فتح غرفة التاسك</button>
    <button class="btn primary" type="button" id="btnApply">تم</button>
  </div>
</section>
<div class="notes" id="notifPanel"><div class="notes-h"><span>إشعارات</span><button class="btn ghost" type="button" id="btnClearNotif">مسح</button></div><div id="notifList"></div></div>

<div class="runov" id="runOverlay" aria-hidden="true">
  <div class="runov-h">
    <div>
      <div class="ttl" id="runTitle">Bot run</div>
      <div class="meta" id="runMeta"></div>
    </div>
    <span class="stchip queued" id="runStatus">queued</span>
  </div>
  <div class="runlog" id="runLog"></div>
  <div class="runov-f">
    <button class="btn danger" type="button" id="btnStopRun">إيقاف فوري</button>
    <button class="btn" type="button" id="btnCloseRun" disabled>إغلاق</button>
  </div>
</div>
<button class="bgchip" type="button" id="bgChip" hidden><span class="dot"></span><span id="bgChipText">شغال في الخلفية</span></button>

<div class="toast-wrap" id="toasts"></div>
<script>
const STATUSES=[{id:'backlog',label:'لاحقاً',color:'#a78bfa'},{id:'todo',label:'مطلوب',color:'#38bdf8'},{id:'doing',label:'جاري',color:'#fbbf24'},{id:'blocked',label:'معلّق',color:'#fb7185'},{id:'done',label:'تم',color:'#34d399'}];
const PRIOS=['low','medium','high','urgent'];
const isHttp=location.protocol.startsWith('http');
let state={version:1,title:'Aqaar Command',tasks:[]};
let view=localStorage.getItem('aqaar.view')||'kanban';
let filter=localStorage.getItem('aqaar.filter')||'all';
let editingId=null,dirty=false,dragId=null,tempComments=[];
let notifications=[],unread=0;
const $=id=>document.getElementById(id);
const nowIso=()=>new Date().toISOString();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markDirty(v=true){dirty=v;$('btnSave').disabled=!dirty||!isHttp}
function toast(title,detail,actions){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML='<b>'+esc(title)+'</b><span>'+esc(detail||'')+'</span>';
  if(actions&&actions.length){ const row=document.createElement('div'); row.className='actions';
    actions.forEach(a=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=a.label; b.onclick=a.onClick; row.appendChild(b)}); el.appendChild(row) }
  $('toasts').prepend(el); setTimeout(()=>el.remove(),7000);
}
function notify(type,title,detail,silent){ notifications.unshift({type,title,detail,at:new Date()}); notifications=notifications.slice(0,50); unread++; renderNotifs(); if(!silent) toast(title,detail) }

async function onJobTerminal(job){
  stopPolling();
  const st=job.status;
  setStatusChip(st);
  $('btnStopRun').disabled=true;
  $('btnCloseRun').disabled=false;
  if(st==='done' && (job.action==='draft_reply'||job.action==='prepare_reply'||(job.result&&job.result.suggestedReply))){
    await refreshSuggestedFromTask(job.taskId);
    notify('done','الرد جاهز للمراجعة','ما اتبعتش إيميل');
  } else if(st==='done'){
    notify('done','الأمر خلص', job.taskId||'');
    if(editingId===job.taskId) await refreshSuggestedFromTask(job.taskId);
  } else if(st==='stopped'){
    notify('hot','اتوقف', job.taskId||'');
  } else if(st==='error'){
    const err=(job.result&&(job.result.error||job.result.message))||'error';
    notify('hot','فشل الأمر', String(err));
  }
  if(bgJobId===job.id && (st==='done'||st==='stopped'||st==='error')){
    showBgChip(false); bgJobId=null;
  }
}

async function pollJob(){
  if(!activeJobId) return;
  try{
    const r=await api('/api/bot/job?id='+encodeURIComponent(activeJobId));
    const job=await r.json();
    if(job.error && !job.id){ setStatusChip('error'); appendLogLines([{t:nowIso(),msg:job.error}]); onJobTerminal({status:'error',result:job,taskId:editingId,id:activeJobId,action:''}); return }
    setStatusChip(job.status);
    appendLogLines(job.log||[]);
    const running=job.status==='queued'||job.status==='running';
    $('btnStopRun').disabled=!running;
    $('btnCloseRun').disabled=running;
    if(!running) await onJobTerminal(job);
  }catch(e){
    appendLogLines([{t:nowIso(),msg:'Poll error: '+(e.message||e)}]);
  }
}

  showOverlay(true);
  stopPolling();
  pollJob();
  pollTimer=setInterval(pollJob, 500);
}

async function runBotNow(){
  if(!isHttp){ toast('السيرفر مش شغال','شغّل Start-Board'); return }
  const action=$('fBotAction').value;
  if(!action||action==='none'){ toast('مفيش أمر','اختار نوع الأمر'); return }
  const title=$('fTitle').value.trim();
  if(!title){ toast('العنوان مطلوب',''); return }
  applyEditKeepOpen();
  if(!editingId){ toast('احفظ التاسك أولاً',''); return }
  const mode=runMode;
  const taskId=editingId;
  try{
    if(dirty) await save();
    toast(mode==='live'?'شغال على الشاشة…':'شغال في الخلفية…', action);
    const r=await api('/api/bot/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId,mode})});
    const j=await r.json();
    if(!j.ok){ toast('فشل التشغيل', j.error||''); return }
    const jobId=j.id;
    if(mode==='live'){
      openRunConsole(jobId,{taskId,action,mode});
    } else {
      bgJobId=jobId; activeJobId=jobId; lastLogLen=0;
      showBgChip(true,'شغال في الخلفية');
      notify('move','شغال في الخلفية', taskId+' · '+action);
      stopPolling();
      pollTimer=setInterval(pollJob, 800);
    }
  }catch(e){ toast('فشل', e.message||e) }
}

function applyEditKeepOpen(){
  const title=$('fTitle').value.trim(); if(!title) return;
  const stamp=nowIso();
  const payload={title,status:$('fStatus').value,priority:$('fPriority').value,source:$('fSource').value,sourceRef:$('fSourceRef').value.trim(),entryId:$('fEntryId').value.trim(),tags:$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),notes:$('fNotes').value,botAction:$('fBotAction').value,botInstruction:$('fBotInstruction').value.trim(),comments:tempComments,suggestedReply:$('fSuggested').value.trim(),due:$('fDue').value||null,assignee:$('fAssignee').value.trim(),progress:Number($('fProgress').value)||0,updatedAt:stamp};
  if(!editingId){
    const id=nextId();
    state.tasks.unshift({id,...payload,checklist:[],createdAt:stamp,createdBy:'User'});
    editingId=id; $('sId').textContent=id; $('sTitle').textContent=title;
  } else {
    const t=state.tasks.find(x=>x.id===editingId); if(!t) return; Object.assign(t,payload);
  }
  markDirty(true); render();
}

async function stopBotNow(){
  if(!activeJobId) return;
  try{
    $('btnStopRun').disabled=true;
    appendLogLines([{t:nowIso(),msg:'Stop requested by user…'}]);
    await api('/api/bot/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:activeJobId})});
    await pollJob();
  }catch(e){ toast('فشل الإيقاف', e.message||e); $('btnStopRun').disabled=false }
}

$('btnRunBot').onclick=()=>runBotNow();
$('btnStopRun').onclick=()=>stopBotNow();
$('btnCloseRun').onclick=()=>{
  showOverlay(false);
  const st=($('runStatus').textContent||'').trim();
  const stillBg=bgJobId && activeJobId===bgJobId && (st==='running'||st==='queued');
  if(!stillBg){
    if(!bgJobId || activeJobId!==bgJobId){ stopPolling(); }
    if(!bgJobId) activeJobId=null;
  }
};
$('bgChip').onclick=()=>{ if(bgJobId){ openRunConsole(bgJobId,{taskId:editingId||'',action:'background',mode:'background'}); } };


setView(view); setFilter(filter);
reload(true).then(()=>syncMail({silent:true}).catch(()=>{})).catch(e=>toast('فشل التحميل',e.message||e));
setInterval(()=>{ if(isHttp&&!dirty){ reload(true).catch(()=>{}); syncMail({silent:true}).catch(()=>{}) } }, 180000);
</script>
