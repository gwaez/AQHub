[package]
name = "aqwizard"
version = "0.1.0"
description = "AQWizard — native Windows companion for AQHub"
authors = ["AQHub"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "aqwizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
